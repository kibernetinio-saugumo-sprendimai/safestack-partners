<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">SafeStack security maturity map</title>
  <desc id="desc">A chart showing security maturity increasing across governance, code, supply chain and verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2b"/>
      <stop offset="1" stop-color="#0b3b43"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62e6c5"/>
      <stop offset="1" stop-color="#62b8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <g opacity=".13" stroke="#b8f8ea" stroke-width="1">
    <path d="M110 70H1140M110 135H1140M110 200H1140M110 265H1140M110 330H1140"/>
    <path d="M110 70V330M367 70V330M624 70V330M881 70V330M1140 70V330"/>
  </g>
  <g fill="#d9fff7" font-family="Inter,Arial,sans-serif">
    <text x="64" y="76" font-size="16" text-anchor="end">100</text>
    <text x="64" y="141" font-size="16" text-anchor="end">75</text>
    <text x="64" y="206" font-size="16" text-anchor="end">50</text>
    <text x="64" y="271" font-size="16" text-anchor="end">25</text>
    <text x="64" y="336" font-size="16" text-anchor="end">0</text>
    <text x="110" y="38" font-size="22" font-weight="700">SafeStack security maturity</text>
    <text x="110" y="58" font-size="14" fill="#91cfc4">Evidence coverage across the partner workflow</text>
    <text x="110" y="375" font-size="15" text-anchor="middle">Governance</text>
    <text x="367" y="375" font-size="15" text-anchor="middle">Code</text>
    <text x="624" y="375" font-size="15" text-anchor="middle">Supply chain</text>
    <text x="881" y="375" font-size="15" text-anchor="middle">Runtime</text>
    <text x="1140" y="375" font-size="15" text-anchor="middle">Verification</text>
    <text x="25" y="200" font-size="15" transform="rotate(-90 25 200)" text-anchor="middle">Coverage score</text>
  </g>
  <path d="M110 292 C190 270 285 248 367 235 S540 190 624 178 S800 132 881 145 S1050 98 1140 84 L1140 330 L110 330 Z" fill="#62e6c5" opacity=".10"/>
  <path d="M110 292 C190 270 285 248 367 235 S540 190 624 178 S800 132 881 145 S1050 98 1140 84" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round" filter="url(#shadow)"/>
  <g fill="#071a2b" stroke="#9af7df" stroke-width="4">
    <circle cx="110" cy="292" r="8"/><circle cx="367" cy="235" r="8"/><circle cx="624" cy="178" r="8"/><circle cx="881" cy="145" r="8"/><circle cx="1140" cy="84" r="8"/>
  </g>
  <g fill="#9af7df" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">
    <text x="110" y="316" text-anchor="middle">42</text><text x="367" y="259" text-anchor="middle">58</text><text x="624" y="202" text-anchor="middle">72</text><text x="881" y="169" text-anchor="middle">80</text><text x="1140" y="108" text-anchor="middle">94</text>
  </g>
</svg>
